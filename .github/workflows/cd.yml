name: CD - Deploy Waki

on:
  workflow_run:
    workflows: ["Waki CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Deploy Waki
        run: |
          cd ~/Waki
          git fetch origin main
          git reset --hard origin/main
          cd backend
          npm ci
          cd ../frontend
          npm ci
          npm run build
          sudo cp -r dist/. /usr/share/nginx/html/
